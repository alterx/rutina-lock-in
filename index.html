<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutina Lock In</title>
<meta name="description" content="Rutina Full Body + Rucking: registro de pesos, progreso y check-in semanal.">
<meta name="theme-color" content="#FFFBFA">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">

<body>
<header class="top">
  <div class="top-in">
    <p class="brand">Lock In</p>
    <p class="weekchip" id="weekchip"></p>
  </div>
</header>

<main id="view" class="wrap" tabindex="-1"></main>

<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <span class="timer-label">Descanso</span>
    <span class="timer-time" id="timer-time">1:15</span>
    <button type="button" class="btn ghost sm" id="timer-plus">+15 s</button>
    <button type="button" class="btn ghost sm" id="timer-skip">Saltar</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<nav class="tabs" aria-label="Secciones">

  <a href="#progreso" data-tab="progreso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 4 3 5-7"/></svg>Progreso</a>
  <a href="#checkin" data-tab="checkin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a1 1 0 0 1 1 1v15H5V5a1 1 0 0 1 1-1zM9 10l2 2 4-4M9 16h6"/></svg>Check-in</a>
  <a href="#guia" data-tab="guia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9l5 5v11H5zM14 4v5h5M8 13h8M8 17h6"/></svg>Guía</a>
</nav>

</html>
